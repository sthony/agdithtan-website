<div id="section-ticker" class="section">
  <div class="card card-primary">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h3 class="card-title">Marquee Ticker</h3>
    </div>
    <div class="card-body">
      <div class="form-group">
        <label>Items <small class="text-muted">(one per line — they scroll left infinitely after the hero)</small></label>
        <textarea id="ticker_items" class="form-control" rows="6" placeholder="Strategy&#10;Branding&#10;Creative&#10;Content Strategy"></textarea>
      </div>
      <!-- live preview -->
      <div id="ticker-preview-wrap" style="overflow:hidden;background:#b6f2a8;padding:10px 0;margin-bottom:16px;white-space:nowrap;border-radius:4px;display:none">
        <span id="ticker-preview-track" style="display:inline-block;font-weight:500;font-size:.95rem;padding:0 12px"></span>
      </div>
      <button onclick="saveSingle('ticker')" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
      <button class="btn btn-danger" onclick="deleteSingle('ticker')">
        <i class="fas fa-trash"></i> Delete
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  const ta = document.getElementById('ticker_items');
  if (!ta) return;
  ta.addEventListener('input', updateTickerPreview);

  function updateTickerPreview() {
    const items = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
    const wrap  = document.getElementById('ticker-preview-wrap');
    const track = document.getElementById('ticker-preview-track');
    if (!items.length) { wrap.style.display = 'none'; return; }
    track.textContent = [...items, ...items].join('  /  ');
    wrap.style.display = 'block';
  }
})();
</script>
