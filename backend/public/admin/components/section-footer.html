<div id="section-footer" class="section">
  <div class="card card-primary">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h3 class="card-title">Footer</h3>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label>Address</label>
            <input type="text" id="f_address" class="form-control">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="text" id="f_phone" class="form-control">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="f_email" class="form-control">
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label>Social Media <small class="text-muted">(comma separated URLs)</small></label>
            <textarea id="f_social_media" class="form-control" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label>Copyright Text</label>
            <input type="text" id="f_copyright_text" class="form-control" placeholder="© 2025 Agdith. All rights reserved.">
          </div>
        </div>
      </div>
      <button onclick="saveSingle('footer')" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
      <button class="btn btn-danger" onclick="deleteSingle('footer')">
        <i class="fas fa-trash"></i> Delete
      </button>
    </div>
  </div>
</div>
