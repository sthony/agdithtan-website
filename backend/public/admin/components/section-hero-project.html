<div id="section-hero-project" class="section">
  <div class="card card-primary">
    <div class="card-header"><h3 class="card-title">Hero Project</h3></div>
    <div class="card-body">
      <div class="form-group">
        <label>Title <small class="text-muted">(optional)</small></label>
        <input type="text" id="hp-title" class="form-control" placeholder="e.g. Featured Project" />
      </div>
      <div class="form-group">
        <label>Description <small class="text-muted">(optional)</small></label>
        <textarea id="hp-description" class="form-control" rows="3" placeholder="Short caption shown under the left image"></textarea>
      </div>
      <div class="form-group">
        <label>Left Image URL <small class="text-muted">(portrait / detail shot — shown centered on light background)</small></label>
        <input type="text" id="hp-image-left" class="form-control" placeholder="https://..." />
        <img id="hp-preview-left" src="" alt="" style="display:none;max-height:160px;margin-top:10px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15)" />
      </div>
      <div class="form-group">
        <label>Right Image URL <small class="text-muted">(full-bleed cover image)</small></label>
        <input type="text" id="hp-image-right" class="form-control" placeholder="https://..." />
        <img id="hp-preview-right" src="" alt="" style="display:none;max-height:160px;margin-top:10px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15)" />
      </div>
      <button class="btn btn-primary" onclick="saveHeroProject()">Save</button>
    </div>
  </div>
</div>
