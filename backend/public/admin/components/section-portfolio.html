<div id="section-portfolio" class="section">
  <!-- Section heading -->
  <div class="card card-primary">
    <div class="card-header">
      <h3 class="card-title">Section Heading</h3>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label>Section Title <span class="text-danger">*</span></label>
            <input type="text" id="ptf_section_title" class="form-control" placeholder="Our Portfolio">
          </div>
        </div>
        <div class="col-md-8">
          <div class="form-group">
            <label>Section Description</label>
            <input type="text" id="ptf_section_desc" class="form-control" placeholder="A selection of our recent work">
          </div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="savePortfolioSection()">
        <i class="fas fa-save"></i> Save Heading
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h3 class="card-title">Portfolio List</h3>
      <button class="btn btn-success btn-sm" onclick="openAddModal('portfolio')">
        <i class="fas fa-plus"></i> Add Item
      </button>
    </div>
    <div class="card-body p-0">
      <table class="table table-striped table-hover">
        <thead class="thead-dark">
          <tr><th>#</th><th>Image</th><th>Title</th><th>Category</th><th>Order</th><th style="width:120px">Actions</th></tr>
        </thead>
        <tbody id="portfolio-tbody">
          <tr><td colspan="6"><div class="empty-state"><i class="fas fa-briefcase"></i>No portfolio items yet</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
