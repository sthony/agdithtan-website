<div id="section-banner" class="section">
  <div class="card card-primary">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h3 class="card-title">Banner Image</h3>
      <button class="btn btn-sm btn-danger" onclick="deleteSingle('banner')">
        <i class="fas fa-trash"></i> Delete
      </button>
    </div>
    <div class="card-body">
      <div class="form-group">
        <label>Image URL <small class="text-muted">(full-width image shown before the footer)</small></label>
        <input type="text" id="banner_image_url" class="form-control" placeholder="https://...">
      </div>
      <div id="banner-preview-wrap" style="display:none; margin-bottom:16px;">
        <img id="banner-preview-img" src="" alt="" style="width:100%; max-height:200px; object-fit:cover; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.15)">
      </div>
      <button onclick="saveSingle('banner')" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  const input = document.getElementById('banner_image_url');
  if (!input) return;
  input.addEventListener('input', function () {
    const wrap = document.getElementById('banner-preview-wrap');
    const img  = document.getElementById('banner-preview-img');
    if (this.value.trim()) { img.src = this.value.trim(); wrap.style.display = 'block'; }
    else                   { wrap.style.display = 'none'; }
  });
})();
</script>
