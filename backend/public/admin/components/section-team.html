<div id="section-team" class="section">
  <!-- Section heading -->
  <div class="card card-primary">
    <div class="card-header">
      <h3 class="card-title">Section Heading</h3>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label>Section Title <span class="text-danger">*</span></label>
            <input type="text" id="team_section_title" class="form-control" placeholder="Meet the Team">
          </div>
        </div>
        <div class="col-md-8">
          <div class="form-group">
            <label>Section Description</label>
            <input type="text" id="team_section_desc" class="form-control" placeholder="The people behind our success">
          </div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveTeamSection()">
        <i class="fas fa-save"></i> Save
      </button>
      <button class="btn btn-danger ml-2" onclick="deleteTeamSection()">
        <i class="fas fa-trash"></i> Delete
      </button>
    </div>
  </div>

  <!-- Team members list -->
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h3 class="card-title">Team Members</h3>
      <button class="btn btn-success btn-sm" onclick="openAddModal('team')">
        <i class="fas fa-plus"></i> Add Member
      </button>
    </div>
    <div class="card-body p-0">
      <table class="table table-striped table-hover">
        <thead class="thead-dark">
          <tr><th>#</th><th>Photo</th><th>Name</th><th>Position</th><th>Email</th><th>Order</th><th style="width:120px">Actions</th></tr>
        </thead>
        <tbody id="team-tbody">
          <tr><td colspan="7"><div class="empty-state"><i class="fas fa-users"></i>No team members yet</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
