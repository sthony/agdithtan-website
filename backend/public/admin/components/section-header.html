<div id="section-header" class="section">
  <div class="card card-primary">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h3 class="card-title">Header / Navigation</h3>
    </div>
    <div class="card-body">
      <div id="header-current" class="alert alert-info d-none">
        <strong>Current data loaded.</strong> Edit below and click Save.
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label>Company Name <span class="text-danger">*</span></label>
            <input type="text" id="h_company_name" class="form-control" placeholder="Agdith">
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label>Website</label>
            <input type="text" id="h_website" class="form-control" placeholder="https://agdith.com">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label>Logo URL</label>
            <input type="text" id="h_logo_url" class="form-control" placeholder="https://...">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label>Phone</label>
            <input type="text" id="h_phone" class="form-control" placeholder="+62 812...">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="h_email" class="form-control" placeholder="info@agdith.com">
          </div>
        </div>
      </div>
      <button onclick="saveSingle('header')" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
      <button class="btn btn-danger" onclick="deleteSingle('header')">
        <i class="fas fa-trash"></i> Delete
      </button>
    </div>
  </div>
</div>
