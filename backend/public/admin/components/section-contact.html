<div id="section-contact" class="section">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h3 class="card-title">Contact Submissions</h3>
      <span id="contact-count" class="badge badge-primary badge-pill"></span>
    </div>
    <div class="card-body p-0">
      <table class="table table-striped table-hover">
        <thead class="thead-dark">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Message</th>
            <th>Date</th>
            <th style="width:80px">Action</th>
          </tr>
        </thead>
        <tbody id="contact-tbody">
          <tr><td colspan="6"><div class="empty-state"><i class="fas fa-envelope-open"></i>No submissions yet</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
